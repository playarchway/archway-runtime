name: Runtime

# Builds Archway's Wine runtime (Wine, FreeType, Wine Mono, D3DMetal) from the playarchway/archway-wine commit in
# wine.ref, publishes it as a release, and proposes it to Archway (propose.yml). Runs when wine.ref changes on
# main, or by hand.
# Archway Bot (organization variable ARCHWAY_BOT_APP_ID, secret ARCHWAY_BOT_PRIVATE_KEY) reads Apple's GPTK from
# the private playarchway/archway-build-inputs (release gptk-4.0-beta-3) and checks out playarchway/archway, whose
# stage-d3dmetal command lays out D3DMetal the way the app expects.
# Runners come from the variable MACOS_RUNNER, for example a Blacksmith label; without it, GitHub's own.

on:
  push:
    branches: [main]
    paths: [wine.ref]
  workflow_dispatch:

permissions:
  contents: write

concurrency: runtime

env:
  GPTK_DMG: Evaluation_environment_for_Windows_games_4.0_beta_3.dmg
  GPTK_SHA256: afa311da371f5b6dd970b45378a3d3df567cc9e535818f56f9b3f9d4c9537c1d

jobs:
  build:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ARCHWAY_BOT_APP_ID }}
          private-key: ${{ secrets.ARCHWAY_BOT_PRIVATE_KEY }}
          repositories: archway,archway-wine,archway-build-inputs
          permission-contents: read
      - name: Read wine.ref
        id: ref
        run: |
          ref="$(tr -d '[:space:]' < wine.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "wine.ref must hold a full 40-character commit ID" >&2; exit 1; }
          echo "commit=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: playarchway/archway-wine
          ref: ${{ steps.ref.outputs.commit }}
          token: ${{ steps.bot.outputs.token }}
          path: wine
      - name: Check that this version is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cut -d' ' -f3 wine/VERSION)-$(git -C wine rev-parse --short=7 HEAD)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; change wine.ref to build another runtime." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: playarchway/archway
          token: ${{ steps.bot.outputs.token }}
          path: archway
      - name: Install Rosetta, Bison, and ccache
        # Wine is an x86_64 build; configure and the build run x86_64 tools.
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          brew install bison ccache
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools
          key: wine-tools-${{ hashFiles('scripts/fetch-wine-tools.sh') }}
      - name: Fetch tools
        run: scripts/fetch-wine-tools.sh "$RUNNER_TEMP/tools"
      - name: Fetch GPTK
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh release download gptk-4.0-beta-3 --repo playarchway/archway-build-inputs --pattern "$GPTK_DMG" --dir "$RUNNER_TEMP"
          echo "$GPTK_SHA256  $RUNNER_TEMP/$GPTK_DMG" | shasum -a 256 -c -
      # Compiled objects from earlier builds; the newest cache is the fallback when this Wine commit has none.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ steps.ref.outputs.commit }}
          restore-keys: ccache-
      - name: Build Wine
        env:
          WINE_SOURCE: ${{ github.workspace }}/wine
          WINE_BUILD: ${{ runner.temp }}/wine-build
          WINE_TOOLS: ${{ runner.temp }}/tools
          BISON_DIR: /opt/homebrew/opt/bison
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
        run: scripts/build-wine.sh "$RUNNER_TEMP/wine-install"
      - name: Package
        env:
          WINE_SOURCE: ${{ github.workspace }}/wine
          WINE_TOOLS: ${{ runner.temp }}/tools
          ARCHWAY_SOURCE: ${{ github.workspace }}/archway
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-runtime.sh "$RUNNER_TEMP/wine-install/usr/local" "$RUNNER_TEMP/$GPTK_DMG" dist "$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "Archway Wine $VERSION" \
            --notes "Wine runtime for Archway, built from playarchway/archway-wine at $COMMIT, with FreeType 2.15.0, Wine Mono 11.3.0, and Apple's D3DMetal (GPTK 4.0 beta 3, non-commercial redistribution under Apple's license). Archway downloads it on first start; to use it by hand, unpack it into DATA/runtime-overlays/NAME/."

  propose:
    needs: build
    uses: ./.github/workflows/propose.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
